name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Enable Windows long paths
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m pip install sympy
      - run: npm run check
      - run: npm test
      - name: Smoke-test package installation
        shell: bash
        run: |
          runner_temp="$(cd "$RUNNER_TEMP" && pwd)"
          tarball="$(npm pack --pack-destination "$RUNNER_TEMP" --silent)"
          install_dir="$(mktemp -d "$runner_temp/package-smoke.XXXXXX")"
          (
            cd "$install_dir"
            npm init -y
            npm install "$runner_temp/$tarball"
          )
          node scripts/test-package.mjs "$install_dir/node_modules/opencode-math-copilot"

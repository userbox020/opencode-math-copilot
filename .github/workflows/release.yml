name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to release (for example, 0.4.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Require main
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases must run from main."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate package version
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_VERSION !== version) {
            console.error(`::error::Release input must equal package.json version (${version}).`);
            process.exit(1);
          }
          NODE
          git check-ref-format "refs/tags/v$RELEASE_VERSION"
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Require a new tag
        shell: bash
        run: |
          if git show-ref --verify --quiet "refs/tags/v$RELEASE_VERSION"; then
            echo "::error::Tag v$RELEASE_VERSION already exists."
            exit 1
          fi
      - name: Extract changelog notes
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          const lines = readFileSync('CHANGELOG.md', 'utf8').split(/\r?\n/);
          const version = process.env.RELEASE_VERSION;
          const start = lines.findIndex(line => /^##\s+(\S+)/.exec(line)?.[1] === version);
          if (start === -1) {
            console.error(`::error::Missing changelog section: ## ${version}`);
            process.exit(1);
          }
          let end = start + 1;
          while (end < lines.length && !/^##\s/.test(lines[end])) end++;
          const notes = lines.slice(start + 1, end).join('\n').trim();
          if (!notes) {
            console.error(`::error::Changelog section for ${version} is empty.`);
            process.exit(1);
          }
          writeFileSync(join(process.env.RUNNER_TEMP, 'release-notes.md'), `${notes}\n`);
          NODE
      - name: Create annotated tag and GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "v$RELEASE_VERSION" -m "Release v$RELEASE_VERSION"
          git push origin "refs/tags/v$RELEASE_VERSION"
          gh release create "v$RELEASE_VERSION" --verify-tag \
            --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"

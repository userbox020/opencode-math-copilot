<html lang="en" data-theme="dark">
<head>

<style>

[data-theme=light]{color-scheme:light;--bg:#f1f4f8;--panel:#fff;--raised:#eaf0f7;--line:#cbd5e2;--text:#172334;--muted:#526178;--green:#146b48;--amber:#855600;--red:#b12e3c;--gray:#526178;--violet:#7143ad;--blue:#245ea8;--shadow:0 24px 90px #22334425}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button,select,input{color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:7px}button{cursor:pointer;padding:8px 13px}button:hover{border-color:var(--blue)}button:disabled{opacity:.4;cursor:default}a{color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(26px,3.4vw,40px);letter-spacing:-1.5px;line-height:1.2;font-weight:650}h2{font-size:18px;letter-spacing:-.4px}h3{font-size:14px}small,.muted{color:var(--muted)}code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}code{overflow-wrap:anywhere}.shell{max-width:1600px;margin:auto;padding:30px 36px 20px}.eyebrow{color:var(--green);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}.topline,.section-head,.footer,.pagination{display:flex;justify-content:space-between;align-items:center;gap:16px}.topline{align-items:flex-start}.actions{display:flex;gap:8px;flex-shrink:0}.subtitle{margin-top:12px;color:var(--muted)}.metadata{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px;align-items:center}.badge{display:inline-flex;align-items:center;gap:6px;font:11px/1.5 ui-monospace,Consolas,monospace;padding:4px 7px;border:1px solid var(--line);border-radius:5px;white-space:nowrap;color:var(--tone,var(--gray));background:var(--panel)}.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0}.snapshot-note{margin:20px 0 24px;padding:12px 15px;border-left:2px solid var(--blue);background:var(--panel);color:var(--muted);font-size:12px}.snapshot-note code{color:var(--text)}.kpis{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:10px;margin-bottom:24px}.kpi{padding:18px 15px;background:var(--panel);border:1px solid var(--line);border-radius:9px;position:relative}.kpi:before{content:"";position:absolute;top:0;left:15px;width:24px;height:2px;background:var(--tone,var(--blue))}.kpi-label{font-size:11px;color:var(--muted)}.kpi-value{font-size:29px;letter-spacing:-1px;font-weight:650;margin:7px 0 3px;font-variant-numeric:tabular-nums}.kpi small{font-size:10px;display:block}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:20px;overflow:hidden}.section-head{padding:20px 22px}.section-head p{color:var(--muted);font-size:12px;margin-top:3px}.index{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-right:10px}.overview-body{padding:0 22px 22px}.stack{display:flex;gap:3px;height:24px;border-radius:5px;overflow:hidden;background:var(--raised)}.segment{padding:0;border:0;border-radius:0;min-width:3px;background:var(--tone)}.segment:hover{filter:brightness(1.2)}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}.legend button{display:flex;gap:10px;align-items:center;padding:6px 9px;font-size:11px;background:transparent}.legend strong{color:var(--text);font-variant-numeric:tabular-nums}.legend button[aria-pressed=true]{border-color:var(--blue);background:var(--raised)}.two-col{display:grid;grid-template-columns:1.25fr 1fr;gap:20px}.provider-group{padding:0 22px 20px}.provider-group h3{display:flex;justify-content:space-between;margin:0 0 10px}.provider-row{display:grid;grid-template-columns:160px 40px 1fr;gap:12px;align-items:start;padding:9px 0;border-top:1px solid var(--line);font-size:12px}.provider-row>strong{text-align:right;font-variant-numeric:tabular-nums}.provider-statuses{display:flex;gap:5px;flex-wrap:wrap}.provider-statuses .badge{font-size:10px;padding:2px 5px}.scroll-area{max-height:405px;overflow:auto}.retry-body{padding:0 22px 20px}.retry-group h3{position:sticky;top:0;background:var(--panel);padding:8px 0;color:var(--muted);font-size:11px;z-index:1}.retry{padding:12px 0;border-top:1px solid var(--line)}.retry .mono{display:block;font-size:11px;overflow-wrap:anywhere;margin:7px 0}.retry-meta{display:flex;justify-content:space-between;gap:8px;font-size:11px}.filters{display:flex;gap:10px;flex-wrap:wrap;padding:0 22px 18px;align-items:end}.field{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted)}.field.search{flex:1;min-width:220px}.field input,.field select{padding:9px 10px;min-height:40px}.field select{max-width:230px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:12px}th{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);background:var(--raised);font-weight:600}th,td{padding:13px 14px;border-bottom:1px solid var(--line);vertical-align:top}#model-table{min-width:1150px}#model-table th:first-child,#model-table td:first-child{padding-left:22px}#model-table tbody tr:hover{background:var(--raised);cursor:pointer}.model-button{padding:0;text-align:left;border:0;background:none;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--text);overflow-wrap:anywhere;max-width:350px}.model-button:hover{color:var(--blue)}.matrix-tag{display:block;font-size:10px;color:var(--muted);margin-top:4px}.chips{display:flex;gap:4px}.chips .badge{padding:3px 5px}.score{white-space:nowrap;font-variant-numeric:tabular-nums}.score small{display:block}.error-cell{max-width:190px}.truncate{max-width:175px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}.pagination{padding:14px 22px;font-size:12px}.pagination .actions{align-items:center}.task-content{padding:0 22px 22px}.task-stats{display:flex;gap:20px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}.task-stat strong{font-size:24px;display:block}.task-stat small{font-size:11px}.breakdowns{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin:18px 0}.breakdowns h3{margin-bottom:8px}.count-row{display:flex;justify-content:space-between;gap:12px;padding:4px 0;font-size:12px}.budget{display:flex;flex-wrap:wrap;gap:7px}.notes{padding:0 22px 22px}.notes ul{padding-left:18px;margin:0 0 18px}.notes li{margin:8px 0;font-size:12px}.sources{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 18px}.sources code{font-size:10px;background:var(--raised);padding:4px 7px;border-radius:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;background:var(--bg);padding:14px;border:1px solid var(--line);border-radius:6px;margin-bottom:0}.footer{padding:6px 0;color:var(--muted);font-size:11px;flex-wrap:wrap}.empty{padding:45px 24px;text-align:center;color:var(--muted)}.empty h2{color:var(--text);margin-bottom:8px}dialog{position:fixed;inset:0 0 0 auto;margin:0;height:100dvh;max-height:100dvh;width:min(760px,100%);max-width:100%;border:0;border-left:1px solid var(--line);background:var(--panel);color:var(--text);padding:0;box-shadow:var(--shadow)}dialog::backdrop{background:#050a13b3;backdrop-filter:blur(3px)}.drawer-head{position:sticky;top:0;padding:22px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:15px;z-index:2}.drawer-head h2{overflow-wrap:anywhere;font-size:17px;margin-top:8px}.drawer-body{padding:22px}.drawer-body h3{margin:24px 0 12px}.drawer-body h3:first-child{margin-top:0}.detail-grid{display:grid;grid-template-columns:120px 1fr;gap:9px;font-size:12px}.detail-grid dt{color:var(--muted)}.detail-grid dd{margin:0;overflow-wrap:anywhere}.detail-text{padding:12px;background:var(--raised);border-radius:6px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px}.screen-detail{padding:14px 0;border-bottom:1px solid var(--line)}.screen-detail p{margin-top:9px;font-size:12px;overflow-wrap:anywhere}.screen-detail .muted{font-size:11px}.no-data{max-width:720px;margin:12vh auto;padding:30px}.no-data p{margin:16px 0}.screen-reader{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(min-width:900px){header{padding-top:12px}}@media(max-width:1250px){.kpis{grid-template-columns:repeat(4,1fr)}.two-col{grid-template-columns:1fr 1fr}.provider-row{grid-template-columns:1fr 35px}.provider-statuses{grid-column:1/-1}}@media(max-width:850px){.two-col{grid-template-columns:1fr}.shell{padding:22px 18px}.topline{flex-direction:column}.section-head{align-items:flex-start}.filters .field{flex:1;min-width:140px}.filters select{max-width:none;width:100%}.provider-row{grid-template-columns:160px 40px 1fr}.provider-statuses{grid-column:auto}}@media(max-width:500px){.kpis{grid-template-columns:repeat(2,1fr)}.breakdowns{grid-template-columns:1fr}.provider-row{grid-template-columns:1fr 35px}.provider-statuses{grid-column:1/-1}.pagination{align-items:flex-start;flex-direction:column}.section-head,.overview-body,.provider-group,.retry-body,.task-content,.notes{padding-left:16px;padding-right:16px}.filters{padding-left:16px;padding-right:16px}.metadata{font-size:11px}.detail-grid{grid-template-columns:1fr}.detail-grid dd{margin-bottom:8px}}
@media(prefers-reduced-motion:no-preference){.shell{animation:enter .35s ease-out}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="shell" id="app"></div>
<dialog id="details" aria-labelledby="detail-title"><div class="drawer-head"><div><span class="eyebrow">Model inspection</span><h2 id="detail-title"></h2></div><button id="close-details" aria-label="Close model details" autofocus>Close ×</button></div><div class="drawer-body" id="detail-body"></div></dialog>
<script src="dashboard-data.js"></script>
<script>
(() => {
 'use strict';
 const $=id=>document.getElementById(id), esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), arr=v=>Array.isArray(v)?v:[], num=v=>typeof v==='number'&&Number.isFinite(v), fmt=v=>num(v)?v.toLocaleString('en-US'):'—', cmd='node bench/v2/free-models/build-dashboard.mjs';
 const D=window.DASHBOARD_DATA;
 if(!D||!D.matrices){$('app').innerHTML=`<main class="no-data panel"><span class="eyebrow">Benchmark console / offline</span><h1>Snapshot unavailable</h1><p>The local dashboard-data.js file is missing or invalid. Regenerate the sanitized snapshot from the repository root, then reload this page.</p><pre><code>${cmd}</code></pre><p><button onclick="location.reload()">Refresh dashboard</button></p></main>`;return;}
 const P=D.project||{}, matrices=Object.entries(D.matrices).filter(([,v])=>v&&typeof v==='object'), rows=matrices.flatMap(([key,m])=>arr(m.models).map(r=>({...r,matrix:key}))), statuses=[...new Set([...arr(D.status_order),...matrices.flatMap(([,m])=>Object.keys(m.counts||{})),...rows.map(r=>r.status).filter(Boolean)])], counts=Object.fromEntries(statuses.map(s=>[s,matrices.reduce((n,[,m])=>n+(num(m.counts?.[s])?m.counts[s]:arr(m.models).filter(r=>r.status===s).length),0)]));
 const tone=s=>({full_complete:'green',screen_passed:'green',completed:'green',screening:'blue',fulling:'blue',quota_wait:'amber',auth_error:'red',error:'red',config_error:'red',tool_protocol_failure:'red',operational_failure:'red',extraction_failure:'red',provider_output:'violet'})[s]||'gray';
 const badge=(s,label=s)=>`<span class="badge" style="--tone:var(--${tone(s)})"><span class="dot" aria-hidden="true"></span>${esc(label)}</span>`;
 const date=v=>{const t=new Date(v);return v&&Number.isFinite(+t)?t.toISOString().replace('T',' ').replace(/\.\d{3}Z$/,' UTC'):'—';};
 const sum=key=>matrices.length&&matrices.every(([,m])=>num(m[key]))?matrices.reduce((n,[,m])=>n+m[key],0):null;
 const total=sum('total_models'), money=v=>num(v)?new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:4}).format(v):'—';
 const clock=Date.parse(D.generated_at), countdown=v=>{const t=Date.parse(v);if(!Number.isFinite(t)||!Number.isFinite(clock))return '—';const mins=Math.ceil(Math.abs(t-clock)/60000), span=mins>=1440?`${Math.floor(mins/1440)}d ${Math.floor(mins%1440/60)}h`:mins>=60?`${Math.floor(mins/60)}h ${mins%60}m`:`${mins}m`;return(t<clock?'overdue ':'in ')+span;};
 const matrixLabel=k=>k==='other'?'Direct providers':k==='free'?'Free providers':D.matrices[k]?.label||k;
 const allModelsPresent=matrices.every(([,m])=>Array.isArray(m.models));
 const metrics=[['Total models',fmt(total),'Across both matrices','blue'],['Scanned models',fmt(sum('scanned_models')),'Observed scan coverage','blue'],['Screen passed',fmt(counts.screen_passed),'Current screen_passed status','green'],['Full 90 records',allModelsPresent?fmt(rows.filter(r=>r.full?.episodes===90).length):'—','90 recorded episodes','green'],['Clean 90',allModelsPresent?fmt(rows.filter(r=>r.full?.episodes===90&&r.full?.completed===90).length):'—','All 90 episodes completed','green'],['Quota waits',fmt(counts.quota_wait),'Current quota_wait status','amber'],['Operational errors',allModelsPresent?fmt(rows.filter(r=>['auth_error','error','config_error','provider_output'].includes(r.status)||r.provider_error!=null).length):'-',`${fmt(counts.tool_protocol_failure??0)} legacy generic failures tracked separately`,'red'],['Observed spend',money(sum('spend_usd')),'Snapshot spend · USD','violet']];
 $('app').innerHTML=`<header><div class="topline"><div><p class="eyebrow" style="margin-bottom:12px">Evaluation lab / benchmark v2</p><h1>${esc(P.name)}</h1><p class="subtitle">Operational coverage, screening outcomes & recorded benchmark scores.</p></div><div class="actions"><button id="theme" aria-label="Switch to light theme">Light theme</button><button id="refresh">↻ Refresh</button></div></div><div class="metadata"><code>${esc(P.branch)} / ${esc(P.commit)}</code><span class="muted">${esc(P.commit_message)}</span>${badge(P.ci&&/green|pass/i.test(P.ci)?'full_complete':'pending',`CI · ${P.ci??'unknown'}`)}${P.dirty?badge('quota_wait','Uncommitted changes'):P.dirty===false?badge('completed','Working tree clean'):''}</div><p class="subtitle mono" style="font-size:11px">${esc(P.repo)} · Snapshot ${date(D.generated_at)}</p><div class="snapshot-note">Sanitized snapshot, not a live feed. Refresh reloads this file; regenerate data with <code>${cmd}</code>. Strict spending-cap enforcement has not been validated.</div></header>
 <main><section class="kpis" aria-label="Benchmark totals">${metrics.map(([label,value,note,color])=>`<article class="kpi" style="--tone:var(--${color})"><div class="kpi-label">${label}</div><div class="kpi-value">${value}</div><small>${note}</small></article>`).join('')}</section>
 <section class="panel" aria-labelledby="status-title"><div class="section-head"><div><h2 id="status-title"><span class="index">01</span>Status overview</h2><p>Both matrices · select a status to explore its models</p></div><span class="badge">${fmt(total)} models</span></div><div class="overview-body"><div class="stack" aria-label="Model status distribution">${statuses.filter(s=>counts[s]>0).map(s=>`<button class="segment" style="flex:${counts[s]};--tone:var(--${tone(s)})" data-status="${esc(s)}" title="${esc(s)}: ${counts[s]}" aria-label="Filter ${esc(s)}, ${counts[s]} models"></button>`).join('')}</div><div class="legend">${statuses.map(s=>`<button data-status="${esc(s)}" aria-pressed="false" style="color:var(--${tone(s)})"><span class="dot" aria-hidden="true"></span><span>${esc(s)}</span><strong>${fmt(counts[s])}</strong></button>`).join('')}</div></div></section>
 <div class="two-col"><section class="panel" aria-labelledby="provider-title"><div class="section-head"><div><h2 id="provider-title"><span class="index">02</span>Provider breakdown</h2><p>Inventory and exact status counts · largest first</p></div></div><div class="scroll-area">${matrices.map(([k,m])=>`<div class="provider-group"><h3>${esc(matrixLabel(k))}<span class="muted">${fmt(m.total_models)} models</span></h3>${arr(m.providers).slice().sort((a,b)=>(b.total||0)-(a.total||0)).map(p=>`<div class="provider-row"><span class="mono">${esc(p.provider)}</span><strong>${fmt(p.total)}</strong><div class="provider-statuses">${[...new Set([...statuses,...Object.keys(p.counts||{})])].filter(s=>p.counts?.[s]>0).map(s=>badge(s,`${s} ${p.counts[s]}`)).join('')}</div></div>`).join('')||'<p class="muted">No provider data.</p>'}</div>`).join('')}</div></section>
 <section class="panel" aria-labelledby="retry-title"><div class="section-head"><div><h2 id="retry-title"><span class="index">03</span>Retry timeline</h2><p>Countdowns relative to snapshot, not your device clock</p></div><span class="badge" id="retry-count"></span></div><div class="scroll-area retry-body" id="retries"></div></section></div>
 <section class="panel" id="explorer" aria-labelledby="explorer-title"><div class="section-head"><div><h2 id="explorer-title"><span class="index">04</span>Model explorer</h2><p>Inspect a model to see screen episodes, condition scores and provider errors.</p></div><span class="badge" id="result-count" role="status" aria-live="polite"></span></div><div class="filters"><label class="field search">Search models, providers or errors<input id="search" type="search" placeholder="Model ID, provider, error…" autocomplete="off"></label><label class="field">Matrix<select id="matrix"><option value="">All matrices</option>${matrices.map(([k])=>`<option value="${esc(k)}">${esc(matrixLabel(k))}</option>`).join('')}</select></label><label class="field">Provider<select id="provider"></select></label><label class="field">Status<select id="status"><option value="">All statuses</option>${statuses.map(s=>`<option>${esc(s)}</option>`).join('')}</select></label><label class="field">Sort by<select id="sort"><option value="model">Model · A–Z</option><option value="status">Status · overview order</option><option value="attempts">Attempts · highest first</option><option value="retry">Next retry · earliest first</option></select></label><button id="reset">Reset</button></div><div class="table-wrap"><table id="model-table"><caption class="screen-reader">Model benchmark results. Open a model for details.</caption><thead><tr><th scope="col">Model ID</th><th scope="col">Provider</th><th scope="col">Status</th><th scope="col">Screen A / B / F</th><th scope="col">Full score</th><th scope="col">Attempts</th><th scope="col">Next retry</th><th scope="col">Last error</th></tr></thead><tbody id="model-rows"></tbody></table></div><div class="pagination"><span id="page-summary"></span><div class="actions"><button id="prev" aria-label="Previous page">← Previous</button><span id="page-number"></span><button id="next" aria-label="Next page">Next →</button></div></div></section>
 <div class="two-col"><section class="panel" aria-labelledby="tasks-title"><div class="section-head"><div><h2 id="tasks-title"><span class="index">05</span>Pilot task set</h2><p>Provisional pilot · not a confirmatory evaluation</p></div>${badge('quota_wait','Provisional')}</div><div class="task-content" id="tasks"></div></section><section class="panel" aria-labelledby="notes-title"><div class="section-head"><h2 id="notes-title"><span class="index">06</span>Read before interpreting</h2></div><div class="notes"><ul>${arr(P.caveats).map(c=>`<li>${esc(c)}</li>`).join('')}</ul><h3>Data sources</h3><div class="sources">${arr(P.sources).map(s=>`<code>${esc(s)}</code>`).join('')||'<span class="muted">No sources supplied.</span>'}</div><h3>How to regenerate</h3><p class="muted" style="font-size:12px;margin-top:5px">Run from the repository root, then refresh this page.</p><pre><code>${cmd}</code></pre></div></section></div></main><footer class="footer"><span>Snapshot ${date(D.generated_at)} · ${esc(D.schema)}</span><code>${esc(P.repo)}</code></footer>`;
 $('refresh').onclick=()=>location.reload();$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark theme':'Light theme';$('theme').setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`);};
 const retries=matrices.flatMap(([k,m])=>arr(m.retries).map(r=>({...r,matrix:k}))).sort((a,b)=>(Date.parse(a.next_attempt_at)||Infinity)-(Date.parse(b.next_attempt_at)||Infinity)), groups=new Map();
 retries.forEach(r=>{const d=date(r.next_attempt_at),key=d==='—'?'Unscheduled':d.slice(0,16)+' UTC';if(!groups.has(key))groups.set(key,[]);groups.get(key).push(r);});
 $('retry-count').textContent=`${retries.length} scheduled`;$('retries').innerHTML=[...groups].map(([time,rs])=>`<div class="retry-group"><h3>${esc(time)}</h3>${rs.map(r=>`<article class="retry"><div class="retry-meta">${badge(r.status)}<strong style="color:var(--amber)">${countdown(r.next_attempt_at)}</strong></div><span class="mono">${esc(r.model)}</span><div class="retry-meta muted"><span>${esc(matrixLabel(r.matrix))}</span><span>${date(r.next_attempt_at)}</span></div></article>`).join('')}</div>`).join('')||'<p class="empty">No retries scheduled in this snapshot.</p>';
 const budget=P.episode_budget||{};
 $('tasks').innerHTML=`<div class="task-stats"><div class="task-stat"><strong>${fmt(P.task_count)}</strong><small>Pilot tasks</small></div><div class="task-stat"><strong>${fmt(P.negative_tasks)}</strong><small>Negative tasks</small></div><div class="task-stat"><strong>${esc(arr(P.conditions).join(' / ')||'—')}</strong><small>Conditions</small></div></div><div class="breakdowns">${[['Type',P.task_types],['Track',P.task_tracks],['Family',P.task_families]].map(([label,data])=>`<div><h3>${label}</h3>${Object.entries(data||{}).map(([k,v])=>`<div class="count-row"><span>${esc(k)}</span><strong>${fmt(v)}</strong></div>`).join('')||'<small>Not supplied</small>'}</div>`).join('')}</div><h3 style="margin-bottom:10px">Configured budget</h3><div class="budget"><span class="badge">${num(budget.duration_ms)?fmt(budget.duration_ms/60000):'—'} min / episode</span><span class="badge">${fmt(budget.tool_calls)} tool calls</span><span class="badge">${fmt(budget.tokens)} tokens</span><span class="badge">${money(budget.usd_per_episode)} / episode</span><span class="badge" style="--tone:var(--amber)">${money(budget.global_cap_usd)} configured study threshold</span></div>`;
 let page=0,filtered=[];const pageSize=50;
 function providers(){const previous=$('provider').value,available=[...new Set(rows.filter(r=>!$('matrix').value||r.matrix===$('matrix').value).map(r=>r.provider).filter(Boolean))].sort();$('provider').innerHTML='<option value="">All providers</option>'+available.map(p=>`<option>${esc(p)}</option>`).join('');if(available.includes(previous))$('provider').value=previous;}
 function screenChips(r){return ['A','B','F'].map(c=>{const entries=arr(r.screen).filter(e=>e.condition===c),e=entries[entries.length-1],symbol=!e?'—':e.correct===true?'✓':e.correct===false?'×':'·',label=!e?'No screen episode':`${e.status??'unknown'}; correct: ${e.correct??'unknown'}`;return `<span class="badge" style="--tone:var(--${!e?'gray':e.correct===true?'green':tone(e.status)==='green'?'gray':tone(e.status)})" title="${esc(c+': '+label)}" aria-label="${esc(c+': '+label)}">${c} ${symbol}</span>`;}).join('');}
 function render(){const q=$('search').value.trim().toLowerCase();filtered=rows.map((r,id)=>({...r,id})).filter(r=>(!q||[r.model,r.provider,r.last_error,r.provider_error?.message,r.provider_error?.type,...arr(r.screen).map(s=>s.error)].some(v=>String(v??'').toLowerCase().includes(q)))&&(!$('matrix').value||r.matrix===$('matrix').value)&&(!$('provider').value||r.provider===$('provider').value)&&(!$('status').value||r.status===$('status').value));const mode=$('sort').value;filtered.sort((a,b)=>{let cmp=0;if(mode==='status')cmp=statuses.indexOf(a.status)-statuses.indexOf(b.status);if(mode==='attempts')cmp=(b.attempts??-1)-(a.attempts??-1);if(mode==='retry')cmp=(Date.parse(a.next_attempt_at)||Infinity)-(Date.parse(b.next_attempt_at)||Infinity);return (Number.isNaN(cmp)?0:cmp)||String(a.model).localeCompare(String(b.model));});page=Math.min(page,Math.max(0,Math.ceil(filtered.length/pageSize)-1));const start=page*pageSize,visible=filtered.slice(start,start+pageSize);$('model-rows').innerHTML=visible.map(r=>`<tr data-row="${r.id}"><td><button class="model-button" data-model="${r.id}" aria-label="Inspect ${esc(r.model)}">${esc(r.model)}</button><span class="matrix-tag">${esc(matrixLabel(r.matrix))}</span></td><td class="mono">${esc(r.provider)}</td><td>${badge(r.status)}</td><td><div class="chips">${screenChips(r)}</div></td><td class="score">${fmt(r.full?.correct)} / ${fmt(r.full?.episodes)}<small>${fmt(r.full?.completed)} completed</small></td><td>${fmt(r.attempts)}</td><td class="score">${r.next_attempt_at?countdown(r.next_attempt_at):'—'}<small>${r.next_attempt_at?date(r.next_attempt_at):'Not scheduled'}</small></td><td class="error-cell"><span class="truncate" title="${esc(r.last_error??'No error recorded')}">${esc(r.last_error)}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No models match these filters. Try another search or reset filters.</td></tr>';$('result-count').textContent=`${fmt(filtered.length)} / ${fmt(rows.length)} models`;$('page-summary').textContent=filtered.length?`Showing ${start+1}–${Math.min(start+pageSize,filtered.length)} of ${fmt(filtered.length)} · 50 per page`:'No matching models';$('page-number').textContent=`${page+1} / ${Math.max(1,Math.ceil(filtered.length/pageSize))}`;$('prev').disabled=page===0;$('next').disabled=start+pageSize>=filtered.length;document.querySelectorAll('.legend [data-status]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.status===$('status').value)));}
 providers();render();['search','matrix','provider','status','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',()=>{page=0;if(id==='matrix')providers();render();}));$('prev').onclick=()=>{page--;render();};$('next').onclick=()=>{page++;render();};$('reset').onclick=()=>{['search','matrix','provider','status'].forEach(id=>$(id).value='');$('sort').value='model';page=0;providers();render();};
 document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{$('matrix').value='';providers();$('provider').value='';$('search').value='';$('status').value=b.dataset.status;page=0;render();$('explorer').scrollIntoView({behavior:'instant',block:'start'});$('status').focus({preventScroll:true});});
 function openModel(id){const r=rows[id];if(!r)return;$('detail-title').textContent=r.model??'Unknown model';const pe=r.provider_error,conditions=Object.entries(r.full?.conditions||{}),detailValue=v=>v&&typeof v==='object'?JSON.stringify(v):esc(v);$('detail-body').innerHTML=`<h3>Overview</h3><dl class="detail-grid"><dt>Provider / matrix</dt><dd>${esc(r.provider)} / ${esc(matrixLabel(r.matrix))}</dd><dt>Status</dt><dd>${badge(r.status)}</dd><dt>Screening</dt><dd>${esc(r.screening)}</dd><dt>Attempts</dt><dd>${fmt(r.attempts)}</dd><dt>Updated</dt><dd>${date(r.updated_at)}</dd><dt>Next retry</dt><dd>${date(r.next_attempt_at)} ${r.next_attempt_at?'· '+countdown(r.next_attempt_at):''}</dd><dt>Categories</dt><dd>${arr(r.categories).map(c=>badge(c)).join(' ')||'None recorded'}</dd></dl><h3>Last error</h3><div class="detail-text">${esc(r.last_error??'No error recorded.')}</div><h3>Provider error</h3>${pe?`<dl class="detail-grid"><dt>Type</dt><dd>${esc(pe.type)}</dd><dt>Status</dt><dd>${esc(pe.status)}</dd></dl><div class="detail-text">${esc(pe.message)}</div>`:'<p class="muted">No provider error recorded.</p>'}<h3>Screen episodes</h3>${arr(r.screen).map(e=>`<article class="screen-detail"><strong>Condition ${esc(e.condition)}</strong> ${badge(e.status)}<p>Correct: <strong>${e.correct===true?'Yes':e.correct===false?'No':'—'}</strong> · ${fmt(e.tokens)} tokens · ${fmt(e.tool_calls)} tool calls</p><p class="muted">Category: ${esc(e.category)}</p>${e.error?`<p>${esc(e.error)}</p>`:''}</article>`).join('')||'<p class="muted">No screen episodes recorded.</p>'}<h3>Full condition breakdown</h3><p class="muted">${fmt(r.full?.correct)} correct / ${fmt(r.full?.episodes)} recorded · ${fmt(r.full?.completed)} completed</p><div class="table-wrap"><table><thead><tr><th>Condition</th><th>Episodes</th><th>Completed</th><th>Correct</th><th>Extraction</th><th>Operational</th></tr></thead><tbody>${conditions.map(([c,v])=>`<tr><td>${esc(c)}</td>${['episodes','completed','correct','extraction','operational'].map(k=>`<td>${typeof v?.[k]==='object'?esc(JSON.stringify(v[k])):detailValue(v?.[k])}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="6">No full condition records.</td></tr>'}</tbody></table></div>`;$('details').showModal();}
 $('model-rows').onclick=e=>{const row=e.target.closest('[data-row]');if(row)openModel(Number(row.dataset.row));};$('close-details').onclick=()=>$('details').close();$('details').addEventListener('click',e=>{if(e.target===$('details')&&e.clientX<$('details').getBoundingClientRect().left)$('details').close();});
})();
</script>
</body>
</html>

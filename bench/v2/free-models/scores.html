<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light">
<title>Model scores · OpenCode Math Copilot</title>
<style>
:root{color-scheme:dark;--bg:#0c1017;--panel:#131a24;--raised:#192230;--line:#2a3545;--text:#e9eef6;--muted:#a1aec0;--green:#71d7aa;--amber:#f0c571;--red:#ff979c;--violet:#c3a2ff;--blue:#8dbbff}
[data-theme=light]{color-scheme:light;--bg:#f1f4f8;--panel:#fff;--raised:#eaf0f7;--line:#cbd5e2;--text:#172334;--muted:#526178;--green:#146b48;--amber:#855600;--red:#b12e3c;--violet:#7143ad;--blue:#245ea8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:9px 12px}button{cursor:pointer}button:hover{border-color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}a{color:var(--blue)}h1,h2,h3,p{margin:0}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-1.5px;line-height:1.2;font-weight:650}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:15px}small,.muted{color:var(--muted)}code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.shell{max-width:1500px;margin:auto;padding:38px 36px 24px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:12px}.topline,.section-head,footer{display:flex;justify-content:space-between;gap:16px;align-items:center}.topline{align-items:flex-start}.actions,.legend,nav{display:flex;gap:10px;flex-wrap:wrap}.subtitle{margin-top:12px;color:var(--muted)}.metadata{margin-top:16px;font-size:12px;color:var(--muted)}.legend{margin-top:22px}.badge{display:inline-block;border:1px solid var(--line);border-radius:5px;padding:4px 8px;font:11px/1.5 ui-monospace,Consolas,monospace;background:var(--panel)}.legend .badge{font-size:12px;padding:9px 12px}.condition-A{--tone:var(--blue)}.condition-B{--tone:var(--violet)}.condition-F{--tone:var(--green)}.letter{color:var(--tone);font-weight:700;margin-right:8px}.notice{margin:22px 0;padding:15px 18px;border-left:3px solid var(--amber);background:var(--panel);color:var(--muted)}.notice strong{color:var(--amber)}nav{margin-bottom:20px;font-size:12px;gap:20px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.headlines{margin-bottom:28px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;min-width:0}.card{padding:22px;border-top:2px solid var(--tone,var(--line))}.card h3{margin-bottom:12px}.big{font-size:32px;font-weight:650;line-height:1.2;letter-spacing:-1px;margin:12px 0}.delta{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap}.negative{color:var(--red)}.positive{color:var(--green)}.headline-loss{border-top-color:var(--red)}.headline-loss .big{color:var(--red)}.mini-row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line)}.panel{margin-bottom:24px;overflow:hidden;scroll-margin-top:16px}.section-head{padding:22px 24px;border-bottom:1px solid var(--line);flex-wrap:wrap}.section-head p{color:var(--muted);margin-top:5px;font-size:12px}.index{color:var(--muted);font:12px ui-monospace,Consolas,monospace;margin-right:14px}.content{padding:22px 24px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-variant-numeric:tabular-nums}caption{text-align:left;color:var(--muted);font-size:12px;padding:14px 24px}th,td{padding:14px 24px;border-bottom:1px solid var(--line);vertical-align:middle}thead th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;background:var(--raised);white-space:nowrap}tbody th{font-weight:500}tbody tr:hover{background:var(--raised)}.model{min-width:270px;max-width:400px;overflow-wrap:anywhere;font-size:12px}.score{min-width:100px;white-space:nowrap}.track{height:4px;background:var(--raised);border:1px solid var(--line);border-radius:3px;margin-top:7px;overflow:hidden}.fill{height:100%;background:var(--tone,var(--blue))}.score small{display:block}.caveats{padding:18px 24px;background:var(--raised);font-size:12px;color:var(--muted)}.caveats h3{font-size:12px;color:var(--text)}ul{padding-left:18px;margin:8px 0 0}li+li{margin-top:5px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}.stats strong{display:block;font-size:18px}.stats small{font-size:11px}.filters{display:flex;align-items:end;flex-wrap:wrap;gap:12px;padding:20px 24px}.field{display:flex;flex-direction:column;gap:6px;color:var(--muted);font-size:12px}.field input,.field select{font-size:13px;width:100%}.search{flex:1;min-width:220px}.empty{padding:32px;text-align:center;color:var(--muted)}footer{font-size:11px;color:var(--muted);flex-wrap:wrap}.completed{white-space:nowrap;font-size:12px}.completed span{display:block}.explanation{margin-top:16px;font-size:12px;color:var(--muted)}.skip{position:absolute;left:20px;top:-100px;background:var(--panel);padding:10px;z-index:2}.skip:focus{top:10px}
@media(max-width:1050px){.headlines{grid-template-columns:1fr}.headlines .card{padding:20px}.big{font-size:30px}}@media(max-width:700px){.shell{padding:24px 18px}.topline{flex-direction:column}.grid{grid-template-columns:1fr}.content,.section-head,.filters,.caveats{padding:18px}th,td{padding:12px 18px}.field{flex:1;min-width:140px}.search{min-width:100%}.legend{gap:6px}.legend .badge{width:100%}}
@media(prefers-reduced-motion:no-preference){.shell{animation:enter .35s ease-out}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head>
<body><a class="skip" href="#main">Skip to scores</a><div class="shell"><header><div class="topline"><div><p class="eyebrow">Evaluation lab / benchmark v2</p><h1>Model scores</h1><p class="subtitle">Three snapshots. Three different ways of measuring success.</p></div><div class="actions"><button id="theme" aria-label="Switch to light theme">Light theme</button><button id="refresh">↻ Refresh</button></div></div><div id="metadata" class="metadata mono"></div><div id="legend" class="legend" aria-label="Condition definitions"></div></header><main id="main"><div id="report"></div></main><footer id="footer"></footer></div>
<script src="scores-data.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),arr=v=>Array.isArray(v)?v:[],num=v=>typeof v==='number'&&Number.isFinite(v),fmt=v=>num(v)?v.toLocaleString('en-US'):'—',C=['A','B','F'],D=window.SCORES_DATA;
$('refresh').onclick=()=>location.reload();$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark theme':'Light theme';$('theme').setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`);};
if(!D||!D.historical||!D.pilot||!D.matrix){$('report').innerHTML='<section class="notice"><h2>Score snapshot unavailable</h2><p>The local scores-data.js file is missing or invalid. Place the generated data beside this page, then select Refresh.</p></section>';return;}
const H=D.historical,P=D.pilot,M=D.matrix,rows=arr(M.models),total=H.total||{},project=D.project||{},definitions=D.definitions||{},fraction=v=>v?`${fmt(v.correct)} / ${fmt(v.n)}`:'—',percent=v=>v&&num(v.correct)&&v.n>0?`${(v.correct/v.n*100).toFixed(1)}%`:'—',pp=v=>num(v)?`${v>0?'+':v<0?'−':''}${Math.abs(v).toFixed(1)} pp`:'—',delta=v=>`<span class="delta ${num(v)&&v<0?'negative':num(v)&&v>0?'positive':''}">${pp(v)}</span>`,date=v=>{const t=Date.parse(v);return Number.isFinite(t)?new Date(t).toISOString().replace('T',' ').replace(/\.\d{3}Z$/,' UTC'):String(v??'—');},score=(v,c='A')=>`<div class="score condition-${c}"><strong>${fraction(v)}</strong><div class="track" aria-hidden="true"><div class="fill" style="width:${v&&num(v.correct)&&v.n>0?Math.max(0,Math.min(100,v.correct/v.n*100)):0}%"></div></div></div>`,caveats=(v)=>`<aside class="caveats"><h3>Read before interpreting</h3><ul>${arr(v).map(s=>`<li>${esc(s)}</li>`).join('')}</ul></aside>`,head=(n,id,title,sub)=>`<div class="section-head"><div><h2 id="${id}"><span class="index">${n}</span>${title}</h2><p>${sub}</p></div></div>`,historicalDetail=(label,v)=>`<div class="mini-row"><span>${label}</span><strong>${fraction(v)} · ${num(v?.rate)?v.rate.toFixed(1)+'%':'—'}</strong></div><p class="explanation" style="margin-top:5px">CI ${arr(v?.ci).map(fmt).join('–')||'—'}% · ${fmt(v?.errors)} errors</p>`;
$('metadata').textContent=`Snapshot ${date(D.generated_at)}${project.repo||D.repo?' · '+(project.repo||D.repo):''}${project.commit||D.commit?' · '+(project.commit||D.commit):''}`;
$('legend').innerHTML=C.map(c=>`<span class="badge condition-${c}"><span class="letter">${c}</span>${esc(definitions[c]||{A:'No tools',B:'Generic tools',F:'Full math-toolkit plugin'}[c])}</span>`).join('');
$('footer').textContent=`Snapshot ${date(D.generated_at)} · ${D.schema??'Unknown schema'} · Local snapshot; refresh reloads this file.`;
$('report').innerHTML=`<aside class="notice"><strong>Do not compare these three benchmarks directly.</strong> They use different scoring and task sets. Keyword matches, pilot contract success, and descriptive matrix totals are not interchangeable measures of mathematical accuracy.</aside>
<nav aria-label="Score sections"><a href="#historical">01 Historical benchmark</a><a href="#pilot">02 DeepSeek pilot</a><a href="#matrix-section">03 Model matrix</a></nav>
<div class="grid headlines" aria-label="Headline comparisons">
<article class="card" style="--tone:var(--blue)"><p class="eyebrow">01 / Keyword scoring</p><h3>Historical keyword benchmark</h3><div class="big">${delta(total.diff_pp)}</div><p class="muted">With − without math-toolkit</p>${historicalDetail('With plugin',total.with)}${historicalDetail('Without plugin',total.without)}</article>
<article class="card headline-loss"><p class="eyebrow">02 / Contract success</p><h3>Real DeepSeek pilot</h3><div class="big">${pp(P.fMinusBpp)} <span style="font-size:16px;letter-spacing:0">F − B${P.fMinusBpp<0?' · lower':''}</span></div><p>${delta(P.fMinusApp)} <span class="muted">F − A</span></p>${C.map(c=>`<div class="mini-row condition-${c}"><span><span class="letter">${c}</span>Correct</span><strong>${fraction(P[c])}</strong></div>`).join('')}<p class="explanation">F: ${fmt(P.F?.completed)} completed, ${fmt(P.F?.extraction)} extraction failures. B: ${fmt(P.B?.completed)} completed, ${fmt(P.B?.extraction)} extraction failures. These are contract-level outcomes, not a mathematical accuracy estimate.</p></article>
<article class="card" style="--tone:var(--violet)"><p class="eyebrow">03 / Descriptive · unpaired</p><h3>Matrix aggregate</h3><p class="muted">Across full_complete models; not necessarily clean runs.</p>${C.map(c=>`<div class="mini-row condition-${c}"><span class="letter">${c}</span><div><strong>${fraction(M.all?.[c])}</strong><small style="display:block">${fmt(M.all?.[c]?.models)} models · ${fmt(M.all?.[c]?.completed)} completed</small></div></div>`).join('')}<p class="explanation">Full-complete is a run status, not a guarantee that every episode completed. Aggregates remain fixed while you filter the table.</p></article></div>
<section class="panel" id="historical" aria-labelledby="historical-title">${head('01','historical-title','Historical keyword benchmark','Keyword scoring — not mathematical accuracy. With / without math-toolkit are historical conditions, not A / B / F.')}<div class="table-wrap" tabindex="0" role="region" aria-label="Historical model scores"><table><caption>${esc(H.title)} · Source: ${esc(H.source)}</caption><thead><tr><th scope="col">Model</th><th scope="col">With plugin</th><th scope="col">Without plugin</th></tr></thead><tbody>${arr(H.models).map(r=>`<tr><th scope="row" class="model mono">${esc(r.model)}</th><td>${score(r.with,'F')}</td><td>${score(r.without,'A')}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No historical model scores available.</td></tr>'}</tbody></table></div>${caveats(H.caveats)}</section>
<section class="panel" id="pilot" aria-labelledby="pilot-title">${head('02','pilot-title','Real DeepSeek pilot',`Contract success · F − B: ${pp(P.fMinusBpp)} · F − A: ${pp(P.fMinusApp)}`)}<div class="content"><div class="grid">${C.map(c=>{const v=P[c];return `<article class="card condition-${c}"><h3><span class="letter">${c}</span>${esc(definitions[c])}</h3><div class="big">${fraction(v)}</div><p class="muted">${percent(v)} contract success</p>${score(v,c)}<div class="stats"><div><strong>${fmt(v?.completed)} / ${fmt(v?.n)}</strong><small>Completed</small></div><div><strong>${fmt(v?.extraction)}</strong><small>Extraction failures</small></div><div><strong>${fmt(v?.operational)}</strong><small>Operational failures</small></div><div><strong>${fmt(v?.tokens)}</strong><small>Tokens</small></div></div><p class="explanation">Observed cost: ${num(v?.cost)?'$'+v.cost.toFixed(5):'—'}</p></article>`;}).join('')}</div><p class="explanation">Correct, completed, and extraction failures are different counts. A completed episode can still fail the scoring contract; the F − B loss should not be attributed solely to extraction failures.</p></div><div class="table-wrap" tabindex="0" role="region" aria-label="Pilot family scores"><table><caption>Family-level contract successes / recorded tasks</caption><thead><tr><th scope="col">Family</th>${C.map(c=>`<th scope="col">${c} correct</th>`).join('')}</tr></thead><tbody>${Object.entries(P.families||{}).map(([family,v])=>`<tr><th scope="row">${esc(family)}</th>${C.map(c=>`<td>${score(v[c],c)}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="4" class="empty">No family scores available.</td></tr>'}</tbody></table></div>${caveats(P.caveats)}</section>
<section class="panel" id="matrix-section" aria-labelledby="matrix-title">${head('03','matrix-title','Model matrix','Full-complete models · descriptive, unpaired results · exact recorded denominators shown.')}<div class="filters"><label class="field search">Search model / provider<input id="search" type="search" placeholder="Model ID or provider…" autocomplete="off"></label><label class="field">Matrix<select id="matrix"><option value="">All matrices</option><option value="free">Free providers</option><option value="other">Direct providers</option></select></label><label class="field">Run quality<select id="clean"><option value="">All runs</option><option value="yes">Clean only</option><option value="no">Not clean</option></select></label><label class="field">Sort by<select id="sort"><option value="delta">F − B · highest first</option><option value="score">F score · highest first</option><option value="model">Model · A–Z</option><option value="completed">Completed · highest first</option></select></label><button id="reset">Reset</button></div><div class="content" style="padding-top:0;padding-bottom:12px"><p id="result-count" role="status" aria-live="polite" class="muted"></p><p class="explanation" style="margin-top:6px">Clean = all episodes completed across A / B / F. Completed sort uses the sum across conditions. A dash means unavailable, not zero.</p></div><div class="table-wrap" tabindex="0" role="region" aria-label="Model matrix scores"><table><caption>Correct / recorded episodes per condition (30 per condition in this snapshot). F − B is in percentage points.</caption><thead><tr><th scope="col">Matrix</th><th scope="col">Model / provider</th>${C.map(c=>`<th scope="col">${c} correct / 30</th>`).join('')}<th scope="col">Completed / condition</th><th scope="col">F − B</th><th scope="col">Clean</th></tr></thead><tbody id="model-rows"></tbody></table></div>${caveats(M.caveats)}</section>`;
function render(){const q=$('search').value.trim().toLowerCase(),matrix=$('matrix').value,clean=$('clean').value,sort=$('sort').value,filtered=rows.filter(r=>(!q||`${r.model??''} ${r.provider??''}`.toLowerCase().includes(q))&&(!matrix||r.matrix===matrix)&&(!clean||(clean==='yes'?r.clean===true:r.clean===false)));const value=r=>sort==='delta'?r.fMinusBpp:sort==='score'?(r.F&&num(r.F.correct)&&r.F.n>0?r.F.correct/r.F.n:null):C.every(c=>num(r[c]?.completed))?C.reduce((sum,c)=>sum+r[c].completed,0):null;filtered.sort((a,b)=>{if(sort!=='model'){const av=value(a),bv=value(b);if(num(av)!==num(bv))return num(av)?-1:1;if(num(av)&&av!==bv)return bv-av;}return String(a.model).localeCompare(String(b.model))||String(a.matrix).localeCompare(String(b.matrix));});$('result-count').textContent=`${filtered.length} / ${rows.length} models shown`;$('model-rows').innerHTML=filtered.map(r=>`<tr><td><span class="badge">${esc(r.matrix==='other'?'Direct':r.matrix==='free'?'Free':r.matrix)}</span></td><th scope="row" class="model mono">${esc(r.model)}</th>${C.map(c=>`<td>${score(r[c],c)}</td>`).join('')}<td class="completed">${C.map(c=>`<span><span class="letter condition-${c}">${c}</span>${fmt(r[c]?.completed)} / ${fmt(r[c]?.n)}</span>`).join('')}</td><td>${delta(r.fMinusBpp)}</td><td><span class="badge ${r.clean===false?'negative':''}">${r.clean===true?'✓ Clean':r.clean===false?'! Not clean':'Unknown'}</span></td></tr>`).join('')||'<tr><td colspan="8" class="empty">No models match these filters. Try another search or select Reset.</td></tr>';}
['search','matrix','clean','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));$('reset').onclick=()=>{['search','matrix','clean'].forEach(id=>$(id).value='');$('sort').value='delta';render();};render();
})();
</script>
</body>
</html>

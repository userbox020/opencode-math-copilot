<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light">
<title>Current runs · OpenCode Math Copilot</title>
<style>
:root{color-scheme:dark;--bg:#0c1017;--panel:#131a24;--raised:#192230;--line:#2a3545;--text:#e9eef6;--muted:#a1aec0;--green:#71d7aa;--amber:#f0c571;--red:#ff979c;--gray:#a1aec0;--violet:#c3a2ff;--blue:#8dbbff}
[data-theme=light]{color-scheme:light;--bg:#f1f4f8;--panel:#fff;--raised:#eaf0f7;--line:#cbd5e2;--text:#172334;--muted:#526178;--green:#146b48;--amber:#855600;--red:#b12e3c;--gray:#526178;--violet:#7143ad;--blue:#245ea8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}button,select{font:inherit;color:var(--text);background:var(--raised);border:1px solid var(--line);border-radius:7px;padding:8px 13px;cursor:pointer}button:hover,select:hover{border-color:var(--blue)}:focus-visible{outline:3px solid var(--blue);outline-offset:3px}h1,h2,h3,h4,p{margin:0}h1{font-size:clamp(30px,4vw,44px);letter-spacing:-1.5px;line-height:1.2;font-weight:650}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:15px}h4{font-size:12px}a{color:var(--blue)}small,.muted{color:var(--muted)}code,.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.shell{max-width:1500px;margin:auto;padding:38px 36px 24px}.eyebrow{font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--green);margin-bottom:12px}.topline,.section-head,.row,.footer{display:flex;justify-content:space-between;align-items:center;gap:16px}.topline{align-items:flex-start}.actions,.badges{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.subtitle{margin-top:12px;color:var(--muted)}.metadata{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;font-size:12px}.badge{display:inline-flex;align-items:center;gap:6px;font:11px/1.5 ui-monospace,Consolas,monospace;border:1px solid var(--line);border-radius:5px;padding:4px 7px;color:var(--tone,var(--gray));background:var(--panel);overflow-wrap:anywhere}.dot{height:6px;width:6px;flex-shrink:0;border-radius:50%;background:currentColor}.notice{margin:20px 0 24px;padding:13px 16px;border-left:2px solid var(--blue);background:var(--panel);font-size:12px;color:var(--muted)}.notice code{color:var(--text)}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:30px}.kpi{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:18px;position:relative}.kpi:before{content:"";position:absolute;top:0;left:18px;width:25px;height:2px;background:var(--tone,var(--blue))}.kpi-label{color:var(--muted);font-size:11px}.kpi-value{font-size:34px;font-weight:650;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums}.kpi small{font-size:10px}.section-head{margin-bottom:16px}.section-head p{color:var(--muted);font-size:12px;margin-top:4px}.index{font:11px ui-monospace,Consolas,monospace;color:var(--muted);margin-right:10px}.field{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:12px}.active-grid,.queues{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.active-grid{margin-bottom:32px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;min-width:0}.run{border-top:2px solid var(--blue);padding:23px}.run.stalled{border-top-color:var(--amber)}.run .model{font-size:16px;line-height:1.6;overflow-wrap:anywhere;margin:16px 0 4px}.run .provider{font-size:12px;color:var(--muted)}.progress-heading{margin:26px 0 10px}.progress-heading strong{font-size:28px;letter-spacing:-.8px;font-variant-numeric:tabular-nums}.progress-heading small{font-size:12px}.progress-track{height:7px;border-radius:5px;background:var(--raised);overflow:hidden}.progress-fill{height:100%;background:var(--blue)}.stalled .progress-fill{background:var(--amber)}.timing{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:20px 0}.timing strong{display:block;font-size:14px;margin:4px 0}.timing small{font-size:10px;display:block}.task{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:15px}.task h4{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:10px}.waiting{color:var(--muted);padding:12px 0}.task-id{font-size:13px;margin-bottom:10px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0 0}.detail-grid dt{color:var(--muted);font-size:11px}.detail-grid dd{margin:3px 0 0;font-size:12px;overflow-wrap:anywhere}.run-foot{border-top:1px solid var(--line);margin-top:18px;padding-top:15px;font-size:12px;overflow-wrap:anywhere}.run-foot p+p{margin-top:8px}.error{color:var(--red);white-space:pre-wrap;overflow-wrap:anywhere}.empty{grid-column:1/-1;padding:34px;text-align:center;background:var(--panel);border:1px dashed var(--line);border-radius:10px}.empty h3{font-size:22px;margin-bottom:8px}.empty p{color:var(--muted)}.queue-head{padding:22px;border-bottom:1px solid var(--line)}.queue-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.queue-stats strong{display:block;font-size:22px;font-variant-numeric:tabular-nums}.queue-stats small{font-size:10px}.queue-statuses{display:flex;gap:6px;flex-wrap:wrap}.queue-section{padding:20px 22px}.queue-section+.queue-section{border-top:1px solid var(--line)}.section-label{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}.section-label small{font-size:11px}.timeline{max-height:310px;overflow:auto;padding-right:6px}.retry{padding:13px 0;border-top:1px solid var(--line)}.retry .mono{display:block;font-size:11px;margin:8px 0;overflow-wrap:anywhere}.retry .row{font-size:11px;flex-wrap:wrap;gap:5px}.countdown{color:var(--blue)}.overdue{color:var(--amber)}.retry.overdue{border-left:2px solid var(--amber);padding-left:10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;font-size:11px;min-width:670px}th{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--raised)}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}td:first-child{min-width:180px;max-width:240px;overflow-wrap:anywhere}.timestamp{white-space:nowrap}.timestamp small{display:block}.error-details{min-width:125px;max-width:220px}.error-details summary{color:var(--muted);cursor:pointer}.error-details p{margin-top:8px;overflow-wrap:anywhere;white-space:pre-wrap}.logs{margin:0 22px 22px;border:1px solid var(--line);border-radius:7px;background:var(--bg)}.logs summary{padding:12px 14px;cursor:pointer;font-size:12px}.logs pre{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;max-height:330px;overflow:auto}.notes{margin-top:26px;display:grid;grid-template-columns:1.1fr 1fr;gap:24px;padding:24px}.notes ul{padding-left:18px;margin:14px 0 0;font-size:12px}.notes li{margin:8px 0}.notes p{font-size:12px;margin-top:10px;color:var(--muted)}pre{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:14px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere}.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}.sources code{font-size:11px;padding:5px 8px;background:var(--raised);border-radius:4px}.footer{padding-top:20px;color:var(--muted);font-size:11px;flex-wrap:wrap}.missing{max-width:720px;margin:12vh auto;padding:30px}.missing p{margin:18px 0}.subtle{font-size:11px;color:var(--muted)}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.queues{grid-template-columns:1fr}}@media(max-width:760px){.shell{padding:24px 18px}.active-grid,.notes{grid-template-columns:1fr}.topline{flex-direction:column}.section-head{align-items:flex-start;flex-wrap:wrap}.run{padding:19px}.metadata{font-size:11px}.timing{gap:12px}}@media(max-width:420px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpi{padding:14px}.queue-section,.queue-head{padding:18px}.timing{grid-template-columns:1fr}.progress-heading{align-items:end}}
@media(prefers-reduced-motion:no-preference){.shell{animation:enter .35s ease-out}@keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style>
</head><body><div class="shell" id="app"></div>
<script src="running-data.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),arr=v=>Array.isArray(v)?v:[],esc=v=>String(v??'—').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>typeof v==='number'&&Number.isFinite(v),fmt=v=>num(v)?v.toLocaleString('en-US'):'—',fallback='node bench/v2/free-models/build-live.mjs',D=window.RUNNING_DATA;
if(!D||!D.queues){$('app').innerHTML=`<main class="missing panel"><p class="eyebrow">Evaluation lab / current runs</p><h1>Run snapshot unavailable</h1><p>The local running-data.js file is missing or invalid. Run this command from the repository root, then reload this page.</p><pre><code>${fallback}</code></pre><button id="refresh">↻ Refresh</button></main>`;$('refresh').onclick=()=>location.reload();return;}
const P=D.project||{},S=D.summary||{},active=arr(D.active),clock=Date.parse(D.generated_at),command=P.refresh_command||fallback;
const tone=s=>({full_complete:'green',screen_passed:'green',completed:'green',screening:'blue',fulling:'blue',quota_wait:'amber',auth_error:'red',error:'red',config_error:'red',tool_protocol_failure:'red',operational_failure:'red',extraction_failure:'red',provider_output:'violet'})[s]||'gray';
const badge=(s,label=s,color=tone(s))=>`<span class="badge" style="--tone:var(--${color})"><span class="dot" aria-hidden="true"></span>${esc(label)}</span>`;
const date=v=>{const t=Date.parse(v);return v&&Number.isFinite(t)?new Date(t).toISOString().replace('T',' ').replace(/\.\d{3}Z$/,' UTC'):'—';};
const duration=ms=>{if(!num(ms)||ms<0)return '—';const s=Math.floor(ms/1000);return s>=86400?`${Math.floor(s/86400)}d ${Math.floor(s%86400/3600)}h`:s>=3600?`${Math.floor(s/3600)}h ${Math.floor(s%3600/60)}m`:s>=60?`${Math.floor(s/60)}m ${s%60}s`:`${s}s`;};
const relative=v=>{const t=Date.parse(v);if(!Number.isFinite(t)||!Number.isFinite(clock))return '—';return t>clock?'in '+duration(t-clock):duration(clock-t)+' ago';};
const overdue=v=>Number.isFinite(clock)&&Date.parse(v)<clock;
const countdown=v=>{const t=Date.parse(v);return !Number.isFinite(t)||!Number.isFinite(clock)?'Time unavailable':(t<clock?'overdue ':'in ')+duration(Math.abs(t-clock));};
const metrics=[['Active runs',S.active,'Recorded as active','blue'],['Stalled runs',S.stalled,'No activity for over 10 min','amber'],['Free active',S.free_active,'Free-provider matrix','blue'],['Direct active',S.other_active,'Direct-provider matrix','violet'],['Nonterminal remaining',num(S.free_nonterminal)&&num(S.other_nonterminal)?S.free_nonterminal+S.other_nonterminal:null,'Includes active and waiting','gray'],['Total models',S.total_models,'Across both matrices','gray']];
$('app').innerHTML=`<header><div class="topline"><div><p class="eyebrow">Evaluation lab / benchmark v2</p><h1>Current runs</h1><p class="subtitle">${esc(P.name)} · In-flight tests and queue activity.</p></div><div class="actions"><button id="theme" aria-label="Switch to light theme">Light theme</button><button id="refresh">↻ Refresh</button></div></div><div class="metadata"><code>${esc(P.branch)} / ${esc(P.commit)}</code><span class="muted">${esc(P.commit_message)}</span>${badge(P.ci&&/green|pass/i.test(P.ci)?'full_complete':'pending',`CI · ${P.ci??'unknown'}`)}${P.dirty?badge('quota_wait','Uncommitted changes'):P.dirty===false?badge('completed','Working tree clean'):''}</div><p class="subtitle mono" style="font-size:11px">${esc(P.repo)} · Snapshot ${date(D.generated_at)}</p><div class="notice"><strong>Snapshot, not a live stream.</strong> Times are relative to this snapshot. No automatic refresh or polling.<br>Regenerate with <code>${esc(command)}</code>, then refresh this page.</div></header><main><section class="kpis" aria-label="Current run totals">${metrics.map(([label,value,note,color])=>`<article class="kpi" style="--tone:var(--${color})"><div class="kpi-label">${label}</div><div class="kpi-value">${fmt(value)}</div><small>${note}</small></article>`).join('')}</section><section aria-labelledby="active-title"><div class="section-head"><div><h2 id="active-title"><span class="index">01</span>In-flight tests</h2><p>Active is an execution state, not a health or correctness signal.</p></div><label class="field">Phase<select id="phase"><option value="">All phases</option><option value="screen">screen</option><option value="full">full</option></select></label></div><p id="active-count" class="subtle" role="status" aria-live="polite" style="margin-bottom:12px"></p><div id="active-runs" class="active-grid"></div></section><section aria-labelledby="queues-title"><div class="section-head"><div><h2 id="queues-title"><span class="index">02</span>Queue monitor</h2><p>Scheduled retries and the latest recorded model activity.</p></div></div><div id="queues" class="queues"></div></section><section class="panel notes" aria-labelledby="notes-title"><div><h2 id="notes-title"><span class="index">03</span>Snapshot notes</h2><ul>${arr(P.caveats).map(c=>`<li>${esc(c)}</li>`).join('')||'<li>No caveats supplied.</li>'}</ul></div><div><h3>How to regenerate</h3><p>Run from the repository root. Refresh reloads the local files; it does not run the generator.</p><pre><code>${esc(command)}</code></pre><h3>Data sources</h3><div class="sources"><code>running-data.js · window.RUNNING_DATA</code>${arr(P.sources??D.sources).map(s=>`<code>${esc(s)}</code>`).join('')}</div><p>Active attempts, queue states and log tails are supplied by this generated snapshot.</p></div></section></main><footer class="footer"><span>Snapshot ${date(D.generated_at)} · ${esc(D.schema)}</span><code>${esc(P.repo)}</code></footer>`;
$('refresh').onclick=()=>location.reload();$('theme').onclick=()=>{const light=document.documentElement.dataset.theme!=='light';document.documentElement.dataset.theme=light?'light':'dark';$('theme').textContent=light?'Dark theme':'Light theme';$('theme').setAttribute('aria-label',`Switch to ${light?'dark':'light'} theme`);};
function runCard(r,i){const valid=num(r.completed)&&num(r.expected)&&r.expected>0,percent=valid?Math.min(100,Math.max(0,r.completed/r.expected*100)):null,t=r.current_task;return `<article class="panel run${r.stalled?' stalled':''}" aria-labelledby="run-${i}"><div class="row"><div class="badges">${badge(r.status)}${r.stalled?badge('quota_wait','Stalled'):''}</div><span class="subtle mono">${esc(r.phase)} · attempt ${fmt(r.attempt)}</span></div><h3 class="model mono" id="run-${i}">${esc(r.model)}</h3><p class="provider">${esc(r.provider)}${r.matrix?' · '+esc(r.matrix==='other'?'Direct providers':r.matrix==='free'?'Free providers':r.matrix):''}</p><div class="row progress-heading"><div><strong>${fmt(r.completed)} / ${fmt(r.expected)}</strong> <small>episodes</small></div><small>${fmt(r.remaining)} remaining</small></div><div class="progress-track" role="progressbar" aria-label="Episode progress for ${esc(r.model)}" aria-valuemin="0" aria-valuemax="${valid?r.expected:100}" ${valid?`aria-valuenow="${Math.min(r.expected,Math.max(0,r.completed))}"`:''} aria-valuetext="${fmt(r.completed)} of ${fmt(r.expected)} episodes"><div class="progress-fill" style="width:${percent??0}%"></div></div><div class="timing"><div><small>Elapsed at snapshot</small><strong>${duration(r.elapsed_ms)}</strong><small>Started ${date(r.started_at)}</small></div><div><small>Last file activity</small><strong>${relative(r.last_activity_at)}</strong><small>${date(r.last_activity_at)}</small></div></div>${r.stalled?'<p class="overdue" style="font-size:12px;margin-bottom:16px">No file activity for more than 10 minutes. Inspect the queue log before interpreting progress.</p>':''}<div class="task"><h4>Latest recorded episode</h4>${t?`<p class="task-id mono">${esc(t.task_id)}</p><div class="badges">${badge(t.status)}<span class="badge">Condition ${esc(t.condition)}</span></div><dl class="detail-grid"><div><dt>Family</dt><dd>${esc(t.family)}</dd></div><div><dt>Correct</dt><dd>${t.correct===true?'Yes':t.correct===false?'No':'—'}</dd></div><div><dt>Tokens</dt><dd>${fmt(t.tokens)}</dd></div><div><dt>Tool calls</dt><dd>${fmt(t.tool_calls)}</dd></div></dl>${t.error?`<p class="error" style="font-size:12px;margin-top:12px">${esc(t.error)}</p>`:''}`:'<p class="waiting">Waiting for first episode</p>'}</div><div class="run-foot"><p><span class="muted">Last error:</span> ${r.last_error?`<span class="error">${esc(r.last_error)}</span>`:'No error recorded'}</p><p><span class="muted">Next retry:</span> ${r.next_attempt_at?`<span class="${overdue(r.next_attempt_at)?'overdue':'countdown'}">${countdown(r.next_attempt_at)}</span> · ${date(r.next_attempt_at)}`:'Not scheduled'}</p></div></article>`;}
function renderRuns(){const phase=$('phase').value,visible=active.filter(r=>!phase||r.phase===phase);$('active-count').textContent=`${visible.length} of ${active.length} active records shown`;$('active-runs').innerHTML=visible.map(runCard).join('')||`<div class="empty"><h3>${active.length?'No active tests in this phase':'No tests running'}</h3><p>${active.length?'Choose another phase to see the other active records.':'No active test records in this snapshot. Queue counts, scheduled retries and recent activity remain below.'}</p></div>`;}
renderRuns();$('phase').addEventListener('change',renderRuns);
function retryList(retries){return arr(retries).slice().sort((a,b)=>(Date.parse(a.next_attempt_at)||Infinity)-(Date.parse(b.next_attempt_at)||Infinity)).map(r=>`<article class="retry${overdue(r.next_attempt_at)?' overdue':''}"><div class="row">${badge(r.status)}<strong class="${overdue(r.next_attempt_at)?'overdue':'countdown'}">${countdown(r.next_attempt_at)}</strong></div><span class="mono">${esc(r.model)}</span><div class="row muted"><span>${esc(r.provider)}</span><time>${date(r.next_attempt_at)}</time></div></article>`).join('')||'<p class="muted" style="font-size:12px;padding:12px 0">No retries scheduled in this snapshot.</p>';}
function queueCard(key,q){const order=[...new Set([...arr(D.status_order),...Object.keys(q.counts||{})])],recent=arr(q.recent).slice().sort((a,b)=>(Date.parse(b.updated_at)||0)-(Date.parse(a.updated_at)||0)).slice(0,12),logs=arr(q.log_tail),label=key==='free'?'Free providers':key==='other'?'Direct providers':q.label||key;return `<article class="panel" aria-labelledby="queue-${esc(key)}"><div class="queue-head"><div class="row"><h3 id="queue-${esc(key)}">${esc(label)}</h3><span class="badge" style="--tone:var(--blue)">${Array.isArray(q.active)?q.active.length:'—'} active</span></div><div class="queue-stats"><div><strong>${fmt(q.total_models)}</strong><small>Total models</small></div><div><strong>${fmt(q.state_models)}</strong><small>Models in state</small></div><div><strong>${fmt(q.nonterminal)}</strong><small>Nonterminal</small></div></div><div class="queue-statuses">${order.filter(s=>Object.hasOwn(q.counts||{},s)).map(s=>badge(s,`${s} ${fmt(q.counts[s])}`)).join('')||'<span class="muted">No status counts supplied.</span>'}</div></div><section class="queue-section"><div class="section-label"><h4>Scheduled retries</h4><small>${arr(q.retries).length} queued · snapshot-relative</small></div><div class="timeline">${retryList(q.retries)}</div></section><section class="queue-section"><div class="section-label"><h4>Recent activity</h4><small>Latest ${recent.length} records · up to 12</small></div><div class="table-wrap"><table><caption class="subtle" style="text-align:left;padding-bottom:10px">Recorded model state; attempt counts may differ from an in-flight attempt.</caption><thead><tr><th scope="col">Model / provider</th><th scope="col">Status</th><th scope="col">Attempts</th><th scope="col">Updated</th><th scope="col">Last error</th></tr></thead><tbody>${recent.map(r=>`<tr><td><span class="mono">${esc(r.model)}</span><div class="muted">${esc(r.provider)}</div></td><td>${badge(r.status)}</td><td>${fmt(r.attempts)}</td><td class="timestamp">${relative(r.updated_at)}<small>${date(r.updated_at)}</small></td><td>${r.last_error?`<details class="error-details"><summary>View error</summary><p>${esc(r.last_error)}</p></details>`:'<span class="muted">None recorded</span>'}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No recent activity recorded.</td></tr>'}</tbody></table></div></section><details class="logs"><summary>Queue log tail · ${logs.length} lines</summary><pre><code>${logs.length?logs.map(line=>esc(String(line).replace(/\u0000/g,'').replace(/^\uFFFD+/,''))).join('\n'):'No log entries supplied.'}</code></pre>${logs.some(line=>/[\u0000\uFFFD]/.test(String(line)))?'<p class="subtle" style="padding:10px 14px">Display only: NUL characters and leading replacement characters removed for readability. Source data is unchanged.</p>':''}</details></article>`;}
$('queues').innerHTML=Object.entries(D.queues).filter(([,q])=>q&&typeof q==='object').map(([key,q])=>queueCard(key,q)).join('')||'<div class="empty"><h3>No queue data</h3><p>Regenerate the snapshot to populate queue summaries.</p></div>';
})();
</script></body></html>
